name: Zues Kernel Build 🕊️

on:
  workflow_dispatch:
  schedule:
    # Weekly check — cheap "did anomalist or susfs move?" job decides if a real build runs.
    - cron: '0 3 * * 1'

env:
  TZ: Asia/Shanghai
  CLANG_VERSION: clang-r547379
  Lineage_VERSION: lineage-24.0
  ANOMALIST_REPO: https://github.com/The-Anomalist/Singularity.git
  ANOMALIST_BRANCH: event-horizon
  # Upstream SUSFS tracked independently of anomalist. anomalist bundles SUSFS
  # directly into its own tree (no submodule pointer we can read), so this is
  # tracked purely as a reference/log signal — it does NOT change what code is
  # pulled in. kernel-4.19 is the correct susfs4ksu branch for this device's
  # msm-4.19-based (non-GKI) source; adjust if the base kernel ever changes.
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19

jobs:
  check-upstream:
    name: Check anomalist + susfs for updates
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      anomalist_sha: ${{ steps.sha.outputs.sha }}
      susfs_sha: ${{ steps.susfs-sha.outputs.sha }}
    steps:
      - name: Get latest event-horizon SHA
        id: sha
        run: |
          SHA=$(git ls-remote "${ANOMALIST_REPO}" "refs/heads/${ANOMALIST_BRANCH}" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Latest ${ANOMALIST_BRANCH}: $SHA"

      # Independent of anomalist: resolves the current HEAD of upstream
      # susfs4ksu's kernel-4.19 branch. This is what lets a susfs-only
      # upstream move be noticed and pinned/logged even on weeks where
      # anomalist itself hasn't moved.
      - name: Get latest susfs4ksu SHA
        id: susfs-sha
        run: |
          SHA=$(git ls-remote "${SUSFS_REPO}" "refs/heads/${SUSFS_BRANCH}" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Latest susfs4ksu ${SUSFS_BRANCH}: $SHA"

      # Cache entry keyed on BOTH upstream SHAs. Hit = we've already built
      # this exact anomalist+susfs pairing before, so a scheduled run can
      # skip. Either upstream moving invalidates the key. A manual
      # workflow_dispatch always builds regardless (see gate step below).
      - name: Check if already built
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/kernel-built-marker
          key: kernel-built-${{ steps.sha.outputs.sha }}-${{ steps.susfs-sha.outputs.sha }}
          lookup-only: true

      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "No new commits on ${ANOMALIST_BRANCH} or susfs4ksu ${SUSFS_BRANCH} since last build — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Kernel
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ks: [zues]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        echo "BUILD_TIME=$(date +%y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME_1=$(date +%Y-%m-%d)" >> $GITHUB_ENV

        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential \
          zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool \
          make squashfs-tools dpkg-dev libssl-dev python3 bc \
          libc6-dev-i386 libncurses5-dev wget rsync

        mkdir -p kernel_workspace

    - name: Cache Clang toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/kernel_workspace/clang-aosp
        key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

    - name: Download Clang (if cache miss)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        cd kernel_workspace
        mkdir clang-aosp
        wget -O ${CLANG_VERSION}.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz
        tar -xf ${CLANG_VERSION}.tar.gz -C clang-aosp

    # ── 32-bit ARM GCC: required for the AArch32 compat vDSO ───────────────────
    # arch/arm64/kernel/vdso32 cannot be built by Clang/lld alone — the kernel's
    # own Makefile hard-requires a real 32-bit ARM compiler via
    # CROSS_COMPILE_ARM32 (see arch/arm64/kernel/vdso32/Makefile: `CC_ARM32 :=
    # $(CROSS_COMPILE_ARM32)gcc`). Without it, vdso_prepare fails with
    # "undeclared identifier '__NR_compat_*'" — that's a missing-toolchain
    # error, not a defconfig/code problem.
    - name: Restore 32-bit ARM GCC toolchain
      id: cache-arm32-gcc
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/kernel_workspace/arm-gcc
        key: ${{ runner.os }}-arm-linux-androideabi-4.9

    - name: Download 32-bit ARM GCC (if cache miss)
      if: steps.cache-arm32-gcc.outputs.cache-hit != 'true'
      run: |
        cd kernel_workspace
        mkdir arm-gcc
        # Pinned commit SHAs, not a branch name: this repo predates AOSP's
        # main/master rename and has no "main" ref at all. googlesource
        # returns HTTP 200 with a tiny stub body for a missing ref instead of
        # a real error, so a branch-name `||` fallback can silently "succeed"
        # on garbage (which is exactly what happened here) — a pinned SHA
        # sidesteps the whole problem.
        ( wget -O arm-gcc.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/887574f98e97475d6fb2f91a8f7b24602466017a.tar.gz \
          || wget -O arm-gcc.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/cfe296ada685a704febf13e203e9c79450b74cff.tar.gz )

        # Fail loudly here (seconds) rather than silently limping into a
        # ~10-minute build that fails on vdso_prepare instead. A real
        # toolchain tarball is >50MB; a stub error body is a few hundred
        # bytes.
        SIZE=$(stat -c%s arm-gcc.tar.gz)
        if [ "$SIZE" -lt 10000000 ]; then
          echo "::error::32-bit ARM GCC download looks wrong (only ${SIZE} bytes) — both pinned SHAs failed."
          exit 1
        fi

        tar -xf arm-gcc.tar.gz -C arm-gcc

    - name: Verify 32-bit ARM GCC works
      run: |
        cd kernel_workspace/arm-gcc
        if [ ! -x bin/arm-linux-androideabi-gcc ]; then
          echo "::error::bin/arm-linux-androideabi-gcc missing after extraction — toolchain archive was bad."
          exit 1
        fi
        bin/arm-linux-androideabi-gcc --version | head -n1

    # Only save once the binary is proven to work — never cache a bad
    # download, or every future run gets a silent "cache hit" on garbage.
    - name: Save 32-bit ARM GCC toolchain
      if: steps.cache-arm32-gcc.outputs.cache-hit != 'true' && success()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/kernel_workspace/arm-gcc
        key: ${{ runner.os }}-arm-linux-androideabi-4.9

    - name: Export CROSS_COMPILE_ARM32
      run: |
        echo "$GITHUB_WORKSPACE/kernel_workspace/arm-gcc/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/kernel_workspace/arm-gcc/bin/arm-linux-androideabi-" >> $GITHUB_ENV
    # ── End 32-bit ARM GCC ───────────────────────────────────────────────────

    - name: Clone kernel source
      run: |
        cd kernel_workspace
        git clone --depth=1 \
           https://github.com/LineageOS/android_kernel_oneplus_sm8250.git \
          -b ${{ env.Lineage_VERSION }} android-kernel

    - name: Integrate Singularity (SUSFS + KernelSU-Next + QoS/thermal)
      env:
        ANOMALIST_SHA: ${{ needs.check-upstream.outputs.anomalist_sha }}
        SUSFS_SHA: ${{ needs.check-upstream.outputs.susfs_sha }}
      run: |
        cd kernel_workspace

        # Promote to job-level env so later steps (RSKSUVER, build-info) see it.
        echo "ANOMALIST_SHA=${ANOMALIST_SHA}" >> $GITHUB_ENV
        echo "SUSFS_SHA=${SUSFS_SHA}" >> $GITHUB_ENV

        # Fetch anomalist at the exact commit check-upstream resolved, as a
        # standalone shallow fetch (not `clone -b branch`) so this job builds
        # precisely what was detected even if event-horizon moves again
        # mid-run. GitHub allows fetching an arbitrary reachable commit SHA
        # directly, not just branch tips/tags.
        mkdir anomalist && cd anomalist && git init -q
        git remote add origin "${ANOMALIST_REPO}"
        git fetch --depth=1 origin "${ANOMALIST_SHA}"
        git checkout -q FETCH_HEAD
        cd ..

        # Discover which KernelSU-Next fork + commit anomalist currently
        # references, instead of hardcoding it — this is what keeps the fork
        # in sync automatically as anomalist updates it.
        KSUN_URL=$(git -C anomalist config -f .gitmodules submodule.KernelSU-Next.url)
        KSUN_SHA=$(git -C anomalist ls-tree HEAD -- KernelSU-Next | awk '{print $3}')
        echo "[Singularity] KSU-Next fork: ${KSUN_URL} @ ${KSUN_SHA}"

        echo "[Singularity] Overlaying onto android-kernel..."
        # A plain (non-submodule-initialized) clone leaves KernelSU-Next as an
        # empty directory, so nothing sensitive to exclude here — just drop
        # anomalist's own top-level .git, which we don't want copied in.
        rsync -a --exclude='/.git' --exclude='/.gitmodules' anomalist/ android-kernel/

        cd android-kernel

        # Fetch KernelSU-Next as its own standalone, self-contained repo
        # (genuine .git directory, not a submodule pointer file) — avoids any
        # dependency on anomalist's .git surviving the overlay above.
        rm -rf KernelSU-Next
        mkdir KernelSU-Next && cd KernelSU-Next && git init -q
        git remote add origin "${KSUN_URL}"
        git fetch --depth=1 origin "${KSUN_SHA}"
        git checkout -q FETCH_HEAD
        cd ..

        echo "[Singularity] Verifying symlink resolves..."
        ls -la drivers/kernelsu
        test -e drivers/kernelsu/Kconfig || { echo "drivers/kernelsu did not resolve"; exit 1; }

        echo "[Singularity] KSU-Next fork pinned at:"
        git -C KernelSU-Next rev-parse HEAD

        echo "[Singularity] KSU/SUSFS config already present in kona-perf_defconfig:"
        grep -iE "ksu|susfs" arch/arm64/configs/vendor/kona-perf_defconfig || true

        # ── SUSFS upstream tracking (informational, on top of the overlay above) ──
        # anomalist bakes SUSFS straight into its tree rather than referencing it
        # as a submodule, so there's no pointer to read the shipped version from.
        # Best-effort: pull whatever version string the bundled susfs.h/susfs.c
        # actually carries, so it can be compared against the upstream SHA
        # check-upstream resolved for susfs4ksu's ${SUSFS_BRANCH} branch.
        SUSFS_VERSION_IN_TREE=$(
          grep -horE '(SUSFS_VERSION[[:space:]]+"[^"]+"|#define[[:space:]]+SUSFS_VERSION[[:space:]]+[0-9]+)' \
            include/linux/susfs.h fs/susfs.c 2>/dev/null | head -n1
        )
        SUSFS_VERSION_IN_TREE="${SUSFS_VERSION_IN_TREE:-unknown (no version string found in tree)}"
        echo "SUSFS_VERSION_IN_TREE=${SUSFS_VERSION_IN_TREE}" >> $GITHUB_ENV

        echo "[SUSFS] Version string bundled by anomalist: ${SUSFS_VERSION_IN_TREE}"
        echo "[SUSFS] Upstream susfs4ksu (${SUSFS_BRANCH}) tracked at:  ${SUSFS_SHA}"
        echo "[SUSFS] NOTE: this build still uses SUSFS exactly as anomalist bundled it."
        echo "[SUSFS]       The line above is a pin/log for drift-checking only —"
        echo "[SUSFS]       it does not pull separate susfs4ksu code into this build."
        # ── End SUSFS upstream tracking ──

        cd ..
        rm -rf anomalist

    - name: Apply Baseband-guard + NoMount on top of Singularity
      run: |
        cd kernel_workspace/android-kernel

        # Baseband-guard
        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

        # Fix LSM ordering safely
        if grep -q "config LSM" security/Kconfig; then
          sed -i '/^config LSM$/,/^help$/ {
            /^[[:space:]]*default/ {
              /baseband_guard/! s/selinux/selinux,baseband_guard/
            }
          }' security/Kconfig
        fi

        # ── Baseband-guard LSM order: belt-and-suspenders fix ──────────────────
        # Baseband-guard's own setup.sh explicitly warns it does NOT wire itself
        # into the boot LSM order on "modern" kernels — it just prints the line
        # to add and expects a manual defconfig edit. The sed above only patches
        # security/Kconfig's *default*, which is silently ignored if any
        # defconfig fragment (kona-perf_defconfig or oplus.config) already sets
        # CONFIG_LSM= explicitly. So set it explicitly ourselves too, matching
        # whichever DEFAULT_SECURITY_* this kernel actually uses.
        DEFCONFIG_FILES="arch/arm64/configs/vendor/kona-perf_defconfig arch/arm64/configs/vendor/oplus.config"
        if grep -qE "^CONFIG_DEFAULT_SECURITY_SMACK=y" $DEFCONFIG_FILES 2>/dev/null; then
          LSM_LINE='CONFIG_LSM=lockdown,yama,loadpin,safesetid,integrity,smack,selinux,tomoyo,apparmor,bpf,baseband_guard'
        elif grep -qE "^CONFIG_DEFAULT_SECURITY_APPARMOR=y" $DEFCONFIG_FILES 2>/dev/null; then
          LSM_LINE='CONFIG_LSM=lockdown,yama,loadpin,safesetid,integrity,apparmor,selinux,smack,tomoyo,bpf,baseband_guard'
        elif grep -qE "^CONFIG_DEFAULT_SECURITY_TOMOYO=y" $DEFCONFIG_FILES 2>/dev/null; then
          LSM_LINE='CONFIG_LSM=lockdown,yama,loadpin,safesetid,integrity,tomoyo,bpf,baseband_guard'
        elif grep -qE "^CONFIG_DEFAULT_SECURITY_DAC=y" $DEFCONFIG_FILES 2>/dev/null; then
          LSM_LINE='CONFIG_LSM=lockdown,yama,loadpin,safesetid,integrity,bpf,baseband_guard'
        else
          # This device family defaults to SELinux — the common case.
          LSM_LINE='CONFIG_LSM=lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard'
        fi
        echo "[Baseband-guard] Appending explicit LSM order to kona-perf_defconfig:"
        echo "  $LSM_LINE"
        echo "$LSM_LINE" >> arch/arm64/configs/vendor/kona-perf_defconfig
        # ── End Baseband-guard LSM order fix ────────────────────────────────────

        bash $GITHUB_WORKSPACE/patches/kernel-4.19-patch.sh || true

        # ── NoMount Integration ────────────────────────────────────────────────
        # nomount dropped the old patch-file workflow. It now ships a setup.sh
        # that clones itself and wires in via a symlink (fs/nomount ->
        # NoMount/kernel/src) plus one-line additions to fs/Makefile and
        # fs/Kconfig — no patch to apply, so no fuzz/conflict risk from the
        # Singularity overlay here.
        curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/master/kernel/setup.sh \
          -o "$GITHUB_WORKSPACE/kernel_workspace/nomount-setup.sh"
        sh "$GITHUB_WORKSPACE/kernel_workspace/nomount-setup.sh"

        echo "[NoMount] Verifying integration..."
        ls -la fs/nomount
        grep -q "CONFIG_NOMOUNT" fs/Makefile || { echo "[NoMount] fs/Makefile not wired"; exit 1; }
        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || { echo "[NoMount] fs/Kconfig not wired"; exit 1; }
        # ── End NoMount Integration ────────────────────────────────────────────

        # Enable NoMount subsystem (KSU manual hook + SUSFS configs already set
        # by Singularity's kona-perf_defconfig — no need to append those here)
        echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/vendor/kona-perf_defconfig

        # Override anomalist's "-Singularity" branding. Kconfig takes the LAST
        # occurrence of a symbol when a defconfig fragment is parsed, so
        # appending this after the file already contains the original line
        # replaces it — no need to sed out the original.
        echo 'CONFIG_LOCALVERSION="-zues"' >> arch/arm64/configs/vendor/kona-perf_defconfig

        # Remove dirty tag
        sed -i 's/ -dirty//g' scripts/setlocalversion

        # Generate version from the (now genuinely git-tracked) KernelSU-Next
        # fork — real history, so no manual re-clone/fetch needed anymore.
        RSKSUVER=$(expr $(git -C KernelSU-Next rev-list --count HEAD) + 30000)
        echo "RSKSUVER=$RSKSUVER" >> $GITHUB_ENV

    - name: Generate defconfig
      run: |
        cd kernel_workspace/android-kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH

        BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu-"
        EX_CMD="LD=ld.lld LLVM=1"
        DEFCONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

        echo "BA_CMD=$BA_CMD" >> $GITHUB_ENV
        echo "EX_CMD=$EX_CMD" >> $GITHUB_ENV
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

        make O=out CC=clang $BA_CMD $EX_CMD $DEFCONFIG

    # ── Audio + USB-C verification ────────────────────────────────────────────
    # Checks the RESOLVED .config (post-Kconfig-dependency-resolution), not the
    # raw defconfig text, since that's the only place that reflects what will
    # actually build. Only touches the small set of core enabling symbols that
    # are consistent across virtually every Android/Linux kernel (SND, SND_SOC,
    # USB core, TYPEC, TYPEC_UCSI). It deliberately does NOT try to guess this
    # fork's specific WCD codec / PMIC Type-C driver names, since forcing an
    # unfamiliar vendor symbol on without knowing its real dependency chain can
    # produce a config that "enables" a driver but fails to build or link. Any
    # such fork-specific gaps are reported, not silently patched.
    - name: Verify and enable audio + USB-C support
      run: |
        cd kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        CFG=out/.config
        REPORT=/tmp/audio_usbc_report.txt
        : > "$REPORT"

        # symbol : human label
        CHECKS="SND:Core sound subsystem
        SND_SOC:ALSA SoC (audio codec/DSP framework)
        USB_DWC3:USB 3 DWC3 controller (dwc3, USB-C data)
        TYPEC:USB Type-C connector class
        TYPEC_UCSI:USB Type-C UCSI (PD negotiation)"

        echo "$CHECKS" | while IFS=':' read -r SYM LABEL; do
          SYM=$(echo "$SYM" | xargs); LABEL=$(echo "$LABEL" | xargs)
          [ -z "$SYM" ] && continue

          if grep -q "^CONFIG_${SYM}=y" "$CFG" 2>/dev/null; then
            echo "[OK]      CONFIG_${SYM}=y already set — ${LABEL}" | tee -a "$REPORT"
          elif grep -qE "^config ${SYM}$" $(find . -name Kconfig) 2>/dev/null; then
            echo "[MISSING] CONFIG_${SYM} not enabled — ${LABEL}. Searching kernel Kconfig and enabling..." | tee -a "$REPORT"
            scripts/config --file "$CFG" --enable "$SYM"
            echo "[FIXED]   CONFIG_${SYM}=y (auto-enabled)" | tee -a "$REPORT"
          else
            echo "[SKIP]    CONFIG_${SYM} not found anywhere in this kernel's Kconfig tree — ${LABEL}. Not present in this fork; needs manual driver work, not a config flip." | tee -a "$REPORT"
          fi
        done

        echo "---- Baseband-guard LSM check ----" | tee -a "$REPORT"
        if grep -qE '^CONFIG_LSM=.*baseband_guard' "$CFG" 2>/dev/null; then
          echo "[OK]      baseband_guard present in resolved CONFIG_LSM order" | tee -a "$REPORT"
        else
          echo "[WARN]    baseband_guard NOT found in resolved CONFIG_LSM= — it will compile but not load at boot. Check for a conflicting CONFIG_LSM= override elsewhere." | tee -a "$REPORT"
        fi

        # Resolve dependencies for anything scripts/config just flipped on
        # (this can also silently disable a symbol if its deps genuinely
        # aren't satisfiable — the post-check below catches that).
        make O=out CC=clang $BA_CMD $EX_CMD olddefconfig

        echo "---- Post-olddefconfig state ----" | tee -a "$REPORT"
        for SYM in SND SND_SOC USB_DWC3 TYPEC TYPEC_UCSI; do
          STATE=$(grep -E "^CONFIG_${SYM}=|^# CONFIG_${SYM} is not set" "$CFG" || echo "CONFIG_${SYM} absent")
          echo "$STATE" | tee -a "$REPORT"
        done

        {
          echo "AUDIO_USBC_REPORT<<EOF"
          cat "$REPORT"
          echo "EOF"
        } >> $GITHUB_ENV
    # ── End audio + USB-C verification ─────────────────────────────────────────

    - name: Build kernel
      run: |
        cd kernel_workspace/android-kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)

        make -j$(nproc --all) O=out CC=clang $BA_CMD $EX_CMD CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

    - name: Verify kernel output
      run: |
        cd kernel_workspace/android-kernel/out

        if [ -f arch/arm64/boot/Image ]; then
          echo "CHECK_IMAGE=true" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(cat include/config/kernel.release)" >> $GITHUB_ENV
        else
          echo "Kernel output file is empty"
          exit 1
        fi

    - name: Prepare AnyKernel3 and package
      run: |
        cd kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=zues Kernel/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cp android-kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        zip -r AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-zues_KSU_${{ env.RSKSUVER }}.zip ./*

    - name: Upload Image artifact
      if: env.CHECK_IMAGE == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: Image-${{ matrix.ks }}
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v6
      with:
        name: AK3-${{ matrix.ks }}
        path: ${{ github.workspace }}/kernel_workspace/AnyKernel3/AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-zues_KSU_*.zip

    - name: Save build info
      run: |
        cd kernel_workspace
        {
          echo "RSKSUVER=${{ env.RSKSUVER }}"
          echo "KERNEL_VERSION=${{ env.KERNEL_VERSION }}"
          echo "BUILD_TIME_1=${{ env.BUILD_TIME_1 }}"
          echo "ANOMALIST_SHA=${{ needs.check-upstream.outputs.anomalist_sha }}"
          echo "SUSFS_UPSTREAM_SHA=${{ needs.check-upstream.outputs.susfs_sha }}"
          echo "SUSFS_VERSION_IN_TREE=${{ env.SUSFS_VERSION_IN_TREE }}"
          echo ""
          echo "-- Audio + USB-C config check --"
          echo "${{ env.AUDIO_USBC_REPORT }}"
        } > build-info-${{ matrix.ks }}.txt

    - name: Upload build info
      uses: actions/upload-artifact@v6
      with:
        name: INFO-${{ matrix.ks }}
        path: kernel_workspace/build-info-${{ matrix.ks }}.txt

    # Record that this anomalist+susfs pairing was successfully built, so a
    # future scheduled run only rebuilds when either upstream actually moves.
    - name: Mark commit pairing as built
      if: success()
      run: mkdir -p /tmp/marker && date > /tmp/kernel-built-marker
    - uses: actions/cache/save@v4
      if: success()
      with:
        path: /tmp/kernel-built-marker
        key: kernel-built-${{ needs.check-upstream.outputs.anomalist_sha }}-${{ needs.check-upstream.outputs.susfs_sha }}
