name: KSUN + SUSFS + no mount Build LineageOS OnePlus 9R SM8250 Kernel

on:
  workflow_dispatch:

env:
  TZ: Asia/Kolkata
  CLANG_VERSION: clang-r547379
  Lineage_VERSION: lineage-24.0
  ANOMALIST_BRANCH: event-horizon
  DEVICE: lemonades

jobs:
  build:
    name: Build OnePlus 9R Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        echo "BUILD_TIME=$(date +%y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME_1=$(date +%Y-%m-%d)" >> $GITHUB_ENV

        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential \
          zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool \
          make squashfs-tools dpkg-dev libssl-dev python3 bc \
          libc6-dev-i386 libncurses5-dev wget patch

        mkdir -p kernel_workspace

    - name: Cache Clang toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/kernel_workspace/clang-aosp
        key: ${{ runner.os }}-${{ env.CLANG_VERSION }}

    - name: Download Clang (if cache miss)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        cd kernel_workspace
        mkdir -p clang-aosp
        wget -O ${CLANG_VERSION}.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz
        tar -xf ${CLANG_VERSION}.tar.gz -C clang-aosp

    - name: Clone LineageOS 24.0 kernel
      run: |
        cd kernel_workspace
        git clone --depth=1 --recursive \
          https://github.com/LineageOS/android_kernel_oneplus_sm8250.git \
          -b ${{ env.Lineage_VERSION }} android-kernel

    - name: Merge Anomalist Singularity event-horizon
      run: |
        cd kernel_workspace/android-kernel

        # The Anomalist tree is a fork of the same SM8250 Lineage kernel.
        git remote add anomalist https://github.com/The-Anomalist/Singularity.git
        git fetch --no-tags anomalist ${{ env.ANOMALIST_BRANCH }}

        git checkout -b lemonades-event-horizon
        git merge --no-ff FETCH_HEAD \
          -m "Merge Anomalist Singularity event-horizon"

    - name: Verify merged Anomalist SUSFS / KernelSU integration
      run: |
        cd kernel_workspace/android-kernel

        echo "=== KernelSU-Next ==="
        test -d KernelSU-Next || {
          echo "ERROR: KernelSU-Next submodule/directory is missing"
          exit 1
        }

        echo "=== SUSFS files ==="
        test -f fs/susfs.c || {
          echo "ERROR: fs/susfs.c is missing after Anomalist merge"
          exit 1
        }

        test -f include/linux/susfs.h || {
          echo "ERROR: include/linux/susfs.h is missing after Anomalist merge"
          exit 1
        }

        grep -q 'CONFIG_KSU_SUSFS' fs/Makefile || {
          echo "ERROR: SUSFS is not referenced by fs/Makefile"
          exit 1
        }

        echo "=== KernelSU / SUSFS Kconfig symbols ==="
        grep -R 'config KSU_SUSFS' KernelSU-Next/kernel/Kconfig || true

        echo "=== Anomalist commit ==="
        git log -1 --oneline

    - name: Setup Baseband-guard
      run: |
        cd kernel_workspace/android-kernel

        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

        # Fix LSM ordering safely
        if grep -q "config LSM" security/Kconfig; then
          sed -i '/^config LSM$/,/^help$/ {
            /^[[:space:]]*default/ {
              /baseband_guard/! s/selinux/selinux,baseband_guard/
            }
          }' security/Kconfig
        fi

    - name: Apply existing kernel patches
      run: |
        cd kernel_workspace/android-kernel

        if [ -f "$GITHUB_WORKSPACE/patches/kernel-4.19-patch.sh" ]; then
          bash "$GITHUB_WORKSPACE/patches/kernel-4.19-patch.sh" || true
        else
          echo "No local kernel-4.19-patch.sh found; continuing."
        fi

    - name: Integrate NoMount
      run: |
        cd kernel_workspace/android-kernel

        NOMOUNT_DIR="$GITHUB_WORKSPACE/kernel_workspace/nomount"
        git clone --depth=1 https://github.com/maxsteeel/nomount.git "$NOMOUNT_DIR"

        echo "[NoMount] Repo contents:"
        find "$NOMOUNT_DIR" -not -path '*/.git/*' | sort

        NOMOUNT_KERNEL_DIR="$NOMOUNT_DIR/kernel"
        PATCH_FILE=$(find "$NOMOUNT_KERNEL_DIR" -maxdepth 2 -name "*4.19*.patch" | head -1)

        if [ -z "$PATCH_FILE" ]; then
          echo "[NoMount] ERROR: No 4.19 patch found"
          find "$NOMOUNT_KERNEL_DIR" -name "*.patch" | sort
          exit 1
        fi

        echo "[NoMount] Applying patch: $PATCH_FILE"
        patch -p1 --fuzz=10 < "$PATCH_FILE" || {
          echo "[NoMount] Patch failed — listing .rej files:"
          find . -name "*.rej" | head -50
          exit 1
        }

        if [ -d "$NOMOUNT_KERNEL_DIR/src" ]; then
          cp "$NOMOUNT_KERNEL_DIR/src/"* fs/
        else
          echo "[NoMount] ERROR: source directory missing"
          exit 1
        fi

        echo "[NoMount] Installed files:"
        ls -la fs/nomount.* 2>/dev/null || true

    - name: Configure OnePlus 9R defconfig with KSU + SUSFS + NoMount
      run: |
        cd kernel_workspace/android-kernel

        DEFCONFIG=arch/arm64/configs/vendor/kona-perf_defconfig

        test -f "$DEFCONFIG" || {
          echo "ERROR: $DEFCONFIG not found"
          exit 1
        }

        # Add only if absent, avoiding duplicate config entries.
        add_config() {
          key="$1"
          value="$2"
          if grep -q "^${key}=" "$DEFCONFIG"; then
            sed -i "s/^${key}=.*/${key}=${value}/" "$DEFCONFIG"
          else
            echo "${key}=${value}" >> "$DEFCONFIG"
          fi
        }

        add_config CONFIG_KSU y
        add_config CONFIG_KSU_MANUAL_HOOK y
        add_config CONFIG_KSU_SUSFS y

        # SUSFS options used by the Anomalist KernelSU-Next integration.
        add_config CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT y
        add_config CONFIG_KSU_SUSFS_SUS_PATH y
        add_config CONFIG_KSU_SUSFS_SUS_MOUNT y
        add_config CONFIG_KSU_SUSFS_SUS_KSTAT y
        add_config CONFIG_KSU_SUSFS_SUS_OVERLAYFS y
        add_config CONFIG_KSU_SUSFS_SUS_MAP y
        add_config CONFIG_KSU_SUSFS_TRY_UMOUNT y
        add_config CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT y
        add_config CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT y
        add_config CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT y
        add_config CONFIG_KSU_SUSFS_SPOOF_UNAME y
        add_config CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
        add_config CONFIG_KSU_SUSFS_OPEN_REDIRECT y
        add_config CONFIG_KSU_SUSFS_ENABLE_LOG y
        add_config CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y

        # Kprobes are required by the traditional KSU hook path.
        add_config CONFIG_KPROBES y
        add_config CONFIG_KRETPROBES y
        add_config CONFIG_KPROBE_EVENTS y

        # NoMount
        add_config CONFIG_NOMOUNT y

        # Avoid a dirty local version in the packaged kernel.
        sed -i 's/ -dirty//g' scripts/setlocalversion

        echo "=== Relevant final defconfig entries ==="
        grep -E '^(CONFIG_KSU|CONFIG_KPROBE|CONFIG_KRETPROBE|CONFIG_NOMOUNT)' "$DEFCONFIG" || true

        echo "=== SUSFS final defconfig entries ==="
        grep -E '^CONFIG_KSU_SUSFS' "$DEFCONFIG" || true

    - name: Generate KernelSU version
      run: |
        cd kernel_workspace/android-kernel

        if [ -d KernelSU-Next/.git ]; then
          RSKSUVER=$(git -C KernelSU-Next rev-list --count HEAD)
        else
          RSKSUVER=unknown
        fi

        echo "RSKSUVER=$RSKSUVER" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        cd kernel_workspace/android-kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo "${{ github.actor }}" | tr A-Z a-z)

        BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu-"
        EX_CMD="LD=ld.lld LLVM=1"
        DEFCONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

        make O=out CC=clang $BA_CMD $EX_CMD $DEFCONFIG

        # Explicitly verify that KSU/SUSFS/NoMount survived config generation.
        echo "=== Generated .config checks ==="
        grep -E '^(CONFIG_KSU|CONFIG_KPROBE|CONFIG_KRETPROBE|CONFIG_NOMOUNT)' out/.config || true
        grep -E '^CONFIG_KSU_SUSFS' out/.config || true

        make -j$(nproc --all) O=out CC=clang $BA_CMD $EX_CMD

    - name: Verify kernel output
      run: |
        cd kernel_workspace/android-kernel/out

        if [ -f arch/arm64/boot/Image ]; then
          echo "CHECK_IMAGE=true" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(cat include/config/kernel.release)" >> $GITHUB_ENV
        else
          echo "Kernel output file is missing"
          exit 1
        fi

    - name: Prepare AnyKernel3 and package
      run: |
        cd kernel_workspace

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh

        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cp android-kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3

        zip -r \
          "AK3-${{ env.Lineage_VERSION }}-${{ env.DEVICE }}-event-horizon-KSU-SUSFS-NoMount.zip" \
          ./*

    - name: Upload Image artifact
      if: env.CHECK_IMAGE == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: Image-${{ env.DEVICE }}
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v6
      with:
        name: AK3-${{ env.DEVICE }}
        path: ${{ github.workspace }}/kernel_workspace/AnyKernel3/AK3-${{ env.Lineage_VERSION }}-${{ env.DEVICE }}-event-horizon-KSU-SUSFS-NoMount.zip

    - name: Save build info
      run: |
        cd kernel_workspace

        {
          echo "DEVICE=${{ env.DEVICE }}"
          echo "LINEAGE_VERSION=${{ env.Lineage_VERSION }}"
          echo "ANOMALIST_BRANCH=${{ env.ANOMALIST_BRANCH }}"
          echo "RSKSUVER=${{ env.RSKSUVER }}"
          echo "KERNEL_VERSION=${{ env.KERNEL_VERSION }}"
          echo "BUILD_TIME_1=${{ env.BUILD_TIME_1 }}"
        } > build-info-${{ env.DEVICE }}.txt

    - name: Upload build info
      uses: actions/upload-artifact@v6
      with:
        name: INFO-${{ env.DEVICE }}
        path: kernel_workspace/build-info-${{ env.DEVICE }}.txt
        
