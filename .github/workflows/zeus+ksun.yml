name: Latest LSUN+Susfs Kernel Build LineageOS OPlus SM8250 Kernel

on:
  workflow_dispatch:
  schedule:
    # Weekly check — cheap "did anomalist move?" job decides if a real build runs.
    - cron: '0 3 * * 1'

env:
  TZ: Asia/Shanghai
  CLANG_VERSION: clang-r547379
  Lineage_VERSION: lineage-24.0
  ANOMALIST_REPO: https://github.com/The-Anomalist/Singularity.git
  ANOMALIST_BRANCH: event-horizon
  KSUN_UPSTREAM_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSUN_UPSTREAM_BRANCH: legacy

jobs:
  check-upstream:
    name: Check anomalist for updates
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      anomalist_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Get latest event-horizon SHA
        id: sha
        run: |
          SHA=$(git ls-remote "${ANOMALIST_REPO}" "refs/heads/${ANOMALIST_BRANCH}" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Latest ${ANOMALIST_BRANCH}: $SHA"

      # Cache entry keyed on the SHA itself. Hit = we've already built this
      # exact commit before, so a scheduled run can skip. A manual
      # workflow_dispatch always builds regardless (see gate step below).
      #
      # NOTE: this gate only tracks anomalist's SHA. A change on the
      # KernelSU-Next legacy branch alone (with anomalist unchanged) will
      # NOT trigger a scheduled rebuild — only workflow_dispatch picks that
      # up, since it always builds regardless of the cache hit.
      - name: Check if already built
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/anomalist-built-marker
          key: anomalist-built-${{ steps.sha.outputs.sha }}
          lookup-only: true

      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "No new commits on ${ANOMALIST_BRANCH} since last build — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Kernel
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ks: [zues]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        echo "BUILD_TIME=$(date +%y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME_1=$(date +%Y-%m-%d)" >> $GITHUB_ENV

        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential \
          zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool \
          make squashfs-tools dpkg-dev libssl-dev python3 bc \
          libc6-dev-i386 libncurses5-dev wget rsync

        mkdir -p kernel_workspace

    - name: Cache Clang toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/kernel_workspace/clang-aosp
        key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

    - name: Download Clang (if cache miss)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        cd kernel_workspace
        mkdir clang-aosp
        wget -O ${CLANG_VERSION}.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz
        tar -xf ${CLANG_VERSION}.tar.gz -C clang-aosp

    - name: Clone kernel source
      run: |
        cd kernel_workspace
        git clone --depth=1 \
           https://github.com/LineageOS/android_kernel_oneplus_sm8250.git \
          -b ${{ env.Lineage_VERSION }} android-kernel

    - name: Integrate Singularity (SUSFS) + adapt KernelSU-Next legacy branch
      env:
        ANOMALIST_SHA: ${{ needs.check-upstream.outputs.anomalist_sha }}
      run: |
        cd kernel_workspace

        # Promote to job-level env so later steps (RSKSUVER, build-info) see it.
        echo "ANOMALIST_SHA=${ANOMALIST_SHA}" >> $GITHUB_ENV

        # Fetch anomalist at the exact commit check-upstream resolved, as a
        # standalone shallow fetch (not `clone -b branch`) so this job builds
        # precisely what was detected even if event-horizon moves again
        # mid-run. GitHub allows fetching an arbitrary reachable commit SHA
        # directly, not just branch tips/tags.
        mkdir anomalist && cd anomalist && git init -q
        git remote add origin "${ANOMALIST_REPO}"
        git fetch --depth=1 origin "${ANOMALIST_SHA}"
        git checkout -q FETCH_HEAD
        cd ..

        # Discover which KernelSU-Next fork + commit anomalist currently
        # references, instead of hardcoding it. We no longer build this fork
        # directly — it's only used as a reference to work out what anomalist
        # changed to make KernelSU-Next susfs-aware (see below).
        KSUN_ANOMALIST_URL=$(git -C anomalist config -f .gitmodules submodule.KernelSU-Next.url)
        KSUN_ANOMALIST_SHA=$(git -C anomalist ls-tree HEAD -- KernelSU-Next | awk '{print $3}')
        echo "[Singularity] KSU-Next fork (susfs reference): ${KSUN_ANOMALIST_URL} @ ${KSUN_ANOMALIST_SHA}"
        echo "[Singularity] KSU-Next build target: ${KSUN_UPSTREAM_REPO} @ ${KSUN_UPSTREAM_BRANCH} (latest)"

        # ── Work out exactly what anomalist changed in KernelSU-Next to make
        # it susfs-aware, so it can be replayed onto a fresh copy of the
        # legacy branch instead of building anomalist's (older) pinned fork.
        mkdir ksun-anomalist-ref && cd ksun-anomalist-ref && git init -q
        git remote add origin "${KSUN_ANOMALIST_URL}"
        git remote add upstream "${KSUN_UPSTREAM_REPO}"
        git fetch -q origin "${KSUN_ANOMALIST_SHA}"
        git checkout -q FETCH_HEAD
        git fetch -q upstream "${KSUN_UPSTREAM_BRANCH}:refs/remotes/upstream/${KSUN_UPSTREAM_BRANCH}"

        MERGE_BASE=$(git merge-base HEAD "refs/remotes/upstream/${KSUN_UPSTREAM_BRANCH}" 2>/dev/null || true)
        if [ -z "$MERGE_BASE" ]; then
          echo "[KSU-Next] No shared history with upstream/${KSUN_UPSTREAM_BRANCH} — anomalist's fork doesn't descend from it."
          echo "[KSU-Next] Falling back to a full diff against upstream's current tip instead of a minimal delta."
          MERGE_BASE=$(git rev-parse "refs/remotes/upstream/${KSUN_UPSTREAM_BRANCH}")
        fi
        echo "[KSU-Next] anomalist's fork diverges from upstream at ${MERGE_BASE}"

        # Scope the diff to kernel/ — the compiled driver source that
        # drivers/kernelsu symlinks to. This excludes the manager app, docs,
        # and CI config, so a mismatched manager/ tree between branches can't
        # generate noise here.
        git diff "${MERGE_BASE}" HEAD -- kernel/ > ../ksun-susfs.patch
        echo "[KSU-Next] susfs-adaptation patch: $(grep -c '^diff --git' ../ksun-susfs.patch || echo 0) file(s), $(wc -l < ../ksun-susfs.patch) lines"
        cd ..
        rm -rf ksun-anomalist-ref

        echo "[Singularity] Overlaying anomalist's tree (SUSFS et al.) onto android-kernel..."
        # A plain (non-submodule-initialized) clone leaves KernelSU-Next as an
        # empty directory, so nothing sensitive to exclude here — just drop
        # anomalist's own top-level .git, which we don't want copied in. This
        # is also how "susfs files come from anomalist" is satisfied: every
        # susfs-touched file in fs/, include/, and the defconfig lands here
        # verbatim from anomalist — nothing is re-fetched from upstream
        # susfs4ksu.
        rsync -a --exclude='/.git' --exclude='/.gitmodules' anomalist/ android-kernel/

        cd android-kernel

        # ── KernelSU-Next: build the latest legacy branch, adapted with
        # anomalist's susfs delta ────────────────────────────────────────────
        rm -rf KernelSU-Next
        git clone --branch "${KSUN_UPSTREAM_BRANCH}" "${KSUN_UPSTREAM_REPO}" KernelSU-Next
        cd KernelSU-Next

        git apply --reject --whitespace=fix -p1 ../../ksun-susfs.patch || true

        if find . -name '*.rej' | grep -q .; then
          echo "::warning::Some KernelSU-Next susfs hunks didn't apply cleanly onto ${KSUN_UPSTREAM_BRANCH} — it has likely moved since anomalist's fork was cut. Rejected hunks:"
          find . -name '*.rej' | while read -r f; do echo "--- $f ---"; cat "$f"; done
          find . -name '*.rej' -delete
          echo "::warning::Review the hunks above; the susfs hook may be incomplete without a manual merge."
          echo "KSUN_ADAPT_STATUS=partial - see workflow log for rejected hunks" >> $GITHUB_ENV
        else
          echo "[KSU-Next] susfs adaptation applied cleanly."
          echo "KSUN_ADAPT_STATUS=clean" >> $GITHUB_ENV
        fi

        if ! grep -riq susfs kernel/; then
          echo "susfs hooks are missing from KernelSU-Next/kernel after adaptation — aborting."
          exit 1
        fi

        git add -A
        git -c user.email="ci@zues.local" -c user.name="Zues CI" commit -q -m "Adapt anomalist's susfs hooks onto ${KSUN_UPSTREAM_BRANCH}" --allow-empty
        cd ..
        # ── End KernelSU-Next adaptation ─────────────────────────────────────

        echo "[Singularity] Verifying symlink resolves..."
        ls -la drivers/kernelsu
        test -e drivers/kernelsu/Kconfig || { echo "drivers/kernelsu did not resolve"; exit 1; }

        echo "[Singularity] KSU-Next now at:"
        git -C KernelSU-Next rev-parse HEAD

        echo "[Singularity] KSU/SUSFS config already present in kona-perf_defconfig:"
        grep -iE "ksu|susfs" arch/arm64/configs/vendor/kona-perf_defconfig || true

        cd ..
        rm -rf anomalist ksun-susfs.patch

    - name: Apply Baseband-guard + NoMount on top of Singularity
      run: |
        cd kernel_workspace/android-kernel

        # Baseband-guard
        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

        # Fix LSM ordering safely
        if grep -q "config LSM" security/Kconfig; then
          sed -i '/^config LSM$/,/^help$/ {
            /^[[:space:]]*default/ {
              /baseband_guard/! s/selinux/selinux,baseband_guard/
            }
          }' security/Kconfig
        fi

        bash $GITHUB_WORKSPACE/patches/kernel-4.19-patch.sh || true

        # ── NoMount Integration ────────────────────────────────────────────────
        # nomount dropped the old patch-file workflow. It now ships a setup.sh
        # that clones itself and wires in via a symlink (fs/nomount ->
        # NoMount/kernel/src) plus one-line additions to fs/Makefile and
        # fs/Kconfig — no patch to apply, so no fuzz/conflict risk from the
        # Singularity overlay here.
        curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/master/kernel/setup.sh \
          -o "$GITHUB_WORKSPACE/kernel_workspace/nomount-setup.sh"
        sh "$GITHUB_WORKSPACE/kernel_workspace/nomount-setup.sh"

        echo "[NoMount] Verifying integration..."
        ls -la fs/nomount
        grep -q "CONFIG_NOMOUNT" fs/Makefile || { echo "[NoMount] fs/Makefile not wired"; exit 1; }
        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || { echo "[NoMount] fs/Kconfig not wired"; exit 1; }
        # ── End NoMount Integration ────────────────────────────────────────────

        # Enable NoMount subsystem (KSU manual hook + SUSFS configs already set
        # by Singularity's kona-perf_defconfig — no need to append those here)
        echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/vendor/kona-perf_defconfig

        # Override anomalist's "-Singularity" branding. Kconfig takes the LAST
        # occurrence of a symbol when a defconfig fragment is parsed, so
        # appending this after the file already contains the original line
        # replaces it — no need to sed out the original.
        echo 'CONFIG_LOCALVERSION="-zues"' >> arch/arm64/configs/vendor/kona-perf_defconfig

        # Remove dirty tag
        sed -i 's/ -dirty//g' scripts/setlocalversion

        # Generate version from the (now genuinely git-tracked) KernelSU-Next
        # fork — real history, so no manual re-clone/fetch needed anymore.
        RSKSUVER=$(expr $(git -C KernelSU-Next rev-list --count HEAD) + 30000)
        echo "RSKSUVER=$RSKSUVER" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        cd kernel_workspace/android-kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)

        BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu-"
        EX_CMD="LD=ld.lld LLVM=1"
        DEFCONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

        make O=out CC=clang $BA_CMD $EX_CMD $DEFCONFIG
        make -j$(nproc --all) O=out CC=clang $BA_CMD $EX_CMD

    - name: Verify kernel output
      run: |
        cd kernel_workspace/android-kernel/out

        if [ -f arch/arm64/boot/Image ]; then
          echo "CHECK_IMAGE=true" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(cat include/config/kernel.release)" >> $GITHUB_ENV
        else
          echo "Kernel output file is empty"
          exit 1
        fi

    - name: Prepare AnyKernel3 and package
      run: |
        cd kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=zues Kernel/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cp android-kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        zip -r AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-zues_KSU_${{ env.RSKSUVER }}.zip ./*

    - name: Upload Image artifact
      if: env.CHECK_IMAGE == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: Image-${{ matrix.ks }}
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v6
      with:
        name: AK3-${{ matrix.ks }}
        path: ${{ github.workspace }}/kernel_workspace/AnyKernel3/AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-zues_KSU_*.zip

    - name: Save build info
      run: |
        cd kernel_workspace
        {
          echo "RSKSUVER=${{ env.RSKSUVER }}"
          echo "KERNEL_VERSION=${{ env.KERNEL_VERSION }}"
          echo "BUILD_TIME_1=${{ env.BUILD_TIME_1 }}"
          echo "ANOMALIST_SHA=${{ needs.check-upstream.outputs.anomalist_sha }}"
          echo "KSUN_BRANCH=${{ env.KSUN_UPSTREAM_BRANCH }}"
          echo "KSUN_ADAPT_STATUS=${{ env.KSUN_ADAPT_STATUS }}"
        } > build-info-${{ matrix.ks }}.txt

    - name: Upload build info
      uses: actions/upload-artifact@v6
      with:
        name: INFO-${{ matrix.ks }}
        path: kernel_workspace/build-info-${{ matrix.ks }}.txt

    # Record that this anomalist commit was successfully built, so a future
    # scheduled run only rebuilds when event-horizon actually moves again.
    - name: Mark anomalist commit as built
      if: success()
      run: mkdir -p /tmp/marker && date > /tmp/anomalist-built-marker
    - uses: actions/cache/save@v4
      if: success()
      with:
        path: /tmp/anomalist-built-marker
        key: anomalist-built-${{ needs.check-upstream.outputs.anomalist_sha }}
