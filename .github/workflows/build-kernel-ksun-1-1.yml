name: AAA Zues Kernel Build LineageOS OPlus SM8250 Kernel (KSUN + SUSFS from 17-ksun)

on:
  workflow_dispatch:
  schedule:
    # Weekly check — cheap "did the 17-ksun branch move?" job decides if a real build runs.
    - cron: '0 3 * * 1'

env:
  TZ: Asia/Shanghai
  CLANG_VERSION: clang-r547379
  Lineage_VERSION: lineage-24.0

  # ── KernelSU-Next + SUSFS source ─────────────────────────────────────────
  # sreeshankark/android_kernel_oneplus_avicii is a full kernel tree. We pick
  # only the KernelSU-Next / SUSFS parts out of it:
  #   * new files   : drivers/kernelsu/, fs/susfs.c, include/linux/susfs*.h
  #   * SUSFS hooks : diff of KSUN_BRANCH against KSUN_BASE_BRANCH (the same
  #                   kernel *without* KSU/SUSFS), restricted to the VFS/proc/
  #                   selinux files listed in the integration step
  #   * KSU configs : the CONFIG_KSU* lines of its avicii_defconfig
  KSUN_REPO: https://github.com/sreeshankark/android_kernel_oneplus_avicii.git
  KSUN_BRANCH: 17-ksun
  KSUN_BASE_BRANCH: '17'

  # ── KernelSU manual hooks ────────────────────────────────────────────────
  # Space-separated raw URLs of patch/diff files that add the KernelSU *manual*
  # hooks. Each patch is split per file and every file is applied on its own
  # (files that don't exist in this tree, e.g. the lahaina defconfig, are skipped).
  # Currently: varakumar01/Levion_kernel_OP9 @ 1d26673 "scope-minimized manual
  # hooks v2.3" (KernelSU-Next v3.4.0-legacy layout): execveat, faccessat, stat,
  # newfstat_ret, sys_reboot, sys_read (init.rc), input_handle_event.
  # Empty = fall back to the manual-hook hunks that already exist in KSUN_BRANCH.
  HOOKS_PATCH_URLS: 'https://github.com/varakumar01/Levion_kernel_OP9/commit/1d266737d1f83fd84327c7888fcb99c28ef5e1ee.patch'

  # 'true'  = fail the build if any hook patch can't be applied cleanly.
  # 'false' = warn (annotation + step summary) and continue without that hook.
  HOOKS_STRICT: 'false'

jobs:
  check-upstream:
    name: Check 17-ksun for updates
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      ksun_sha: ${{ steps.ksun.outputs.sha }}
      ksun_base_sha: ${{ steps.ksun.outputs.base_sha }}
      hooks_key: ${{ steps.ksun.outputs.hooks_key }}
    steps:
      # Resolve the exact commits (pins the build even if the branch moves
      # mid-run) and a short key for the configured hook URLs.
      - name: Resolve KSUN branch + base branch SHAs
        id: ksun
        run: |
          SHA=$(git ls-remote "${KSUN_REPO}" "refs/heads/${KSUN_BRANCH}" | cut -f1)
          BASE_SHA=$(git ls-remote "${KSUN_REPO}" "refs/heads/${KSUN_BASE_BRANCH}" | cut -f1)
          [ -n "$SHA" ]      || { echo "Could not resolve ${KSUN_REPO} @ ${KSUN_BRANCH}"; exit 1; }
          [ -n "$BASE_SHA" ] || { echo "Could not resolve ${KSUN_REPO} @ ${KSUN_BASE_BRANCH}"; exit 1; }
          HOOKS_KEY=$(printf '%s' "${HOOKS_PATCH_URLS}" | sha1sum | cut -c1-12)

          echo "sha=$SHA"            >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA"  >> "$GITHUB_OUTPUT"
          echo "hooks_key=$HOOKS_KEY" >> "$GITHUB_OUTPUT"
          echo "${KSUN_BRANCH}: $SHA | ${KSUN_BASE_BRANCH}: $BASE_SHA | hooks key: $HOOKS_KEY"

      # Hit = this exact (branch commit, base commit, hook URLs) was already
      # built, so a scheduled run can skip. workflow_dispatch always builds.
      - name: Check if already built
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/ksun-built-marker
          key: ksun-built-${{ steps.ksun.outputs.sha }}-${{ steps.ksun.outputs.base_sha }}-${{ steps.ksun.outputs.hooks_key }}
          lookup-only: true

      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "No new commits on ${KSUN_BRANCH} and no hook URL change since last build — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Kernel
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ks: [zues]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        echo "BUILD_TIME=$(date +%y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME_1=$(date +%Y-%m-%d)" >> $GITHUB_ENV

        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential \
          zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool \
          make squashfs-tools dpkg-dev libssl-dev python3 bc \
          libc6-dev-i386 libncurses5-dev wget rsync

        mkdir -p kernel_workspace

    - name: Cache Clang toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/kernel_workspace/clang-aosp
        key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

    - name: Download Clang (if cache miss)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        cd kernel_workspace
        mkdir clang-aosp
        wget -O ${CLANG_VERSION}.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz
        tar -xf ${CLANG_VERSION}.tar.gz -C clang-aosp

    - name: Clone kernel source
      run: |
        cd kernel_workspace
        git clone --depth=1 \
           https://github.com/LineageOS/android_kernel_oneplus_sm8250.git \
          -b ${{ env.Lineage_VERSION }} android-kernel

    - name: Integrate KernelSU-Next + SUSFS (17-ksun) and manual hooks
      env:
        KSUN_SHA: ${{ needs.check-upstream.outputs.ksun_sha }}
        KSUN_BASE_SHA: ${{ needs.check-upstream.outputs.ksun_base_sha }}
      run: |
        cd kernel_workspace
        echo "KSUN_SHA=${KSUN_SHA}" >> $GITHUB_ENV

        # ── 1. Sparse, blobless fetch of the source repo at the pinned commits.
        # Only drivers/kernelsu, the SUSFS core files and the defconfig are
        # checked out; hook diffs are produced with `git diff` between the
        # branch and its KSU-less base (blobs are fetched lazily per file).
        rm -rf ksun-src && mkdir ksun-src && cd ksun-src
        git init -q
        git remote add origin "${KSUN_REPO}"
        git sparse-checkout init --no-cone
        git sparse-checkout set \
          '/drivers/kernelsu/' '/fs/susfs.c' \
          '/include/linux/susfs.h' '/include/linux/susfs_def.h' \
          '/arch/arm64/configs/avicii_defconfig'
        git fetch -q --depth=1 --filter=blob:none origin "${KSUN_SHA}" "${KSUN_BASE_SHA}"
        git checkout -q "${KSUN_SHA}"
        SRC="$PWD"
        cd ../android-kernel

        for f in drivers/kernelsu/Kbuild fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
          [ -e "$SRC/$f" ] || { echo "::error::$f missing in ${KSUN_BRANCH} @ ${KSUN_SHA:0:9}"; exit 1; }
        done

        {
          echo "### KernelSU-Next + SUSFS from \`${KSUN_BRANCH}\` @ \`${KSUN_SHA:0:9}\` (base \`${KSUN_BASE_BRANCH}\` @ \`${KSUN_BASE_SHA:0:9}\`)"
          echo "| Item | Result |"
          echo "|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"

        # ── 2. New files: KernelSU-Next (real in-tree dir) + SUSFS core.
        rm -rf drivers/kernelsu
        cp -a "$SRC/drivers/kernelsu" drivers/kernelsu
        cp -a "$SRC/fs/susfs.c" fs/susfs.c
        cp -a "$SRC/include/linux/susfs.h" include/linux/susfs.h
        cp -a "$SRC/include/linux/susfs_def.h" include/linux/susfs_def.h
        echo "| drivers/kernelsu + fs/susfs.c + susfs headers | copied |" >> "$GITHUB_STEP_SUMMARY"

        # ── 3. Build wiring (idempotent — no patch context to conflict).
        grep -q 'kernelsu' drivers/Makefile \
          || printf '\n# KernelSU\nobj-$(CONFIG_KSU)\t\t+= kernelsu/\n' >> drivers/Makefile
        if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
          [ "$(tail -n1 drivers/Kconfig)" = "endmenu" ] \
            || { echo "::error::drivers/Kconfig does not end with endmenu"; exit 1; }
          sed -i '$ i source "drivers/kernelsu/Kconfig"\n' drivers/Kconfig
        fi
        grep -q 'CONFIG_KSU_SUSFS' fs/Makefile \
          || printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile
        echo "| drivers/Makefile, drivers/Kconfig, fs/Makefile | wired |" >> "$GITHUB_STEP_SUMMARY"

        # ── 4. Defconfig: KSU / SUSFS options exactly as the 17-ksun defconfig
        # sets them (both "=y" and "is not set" forms).
        DEFCFG=arch/arm64/configs/vendor/kona-perf_defconfig
        {
          echo ""
          echo "# --- KernelSU-Next + SUSFS (from ${KSUN_BRANCH}) ---"
          grep -E '^(# )?CONFIG_KSU' "$SRC/arch/arm64/configs/avicii_defconfig"
        } >> "$DEFCFG"
        grep -q '^CONFIG_KSU_SUSFS=y' "$DEFCFG" \
          || { echo "::error::no CONFIG_KSU_SUSFS in source defconfig"; exit 1; }

        # Manual hooks are used, so force KSU + MANUAL_HOOK on and kprobe hooking
        # off (the hook commit's own defconfig change targets lahaina and is
        # skipped, so it is replicated here).
        sed -i -E '/^(# )?CONFIG_KSU(_MANUAL_HOOK|_KPROBES_HOOK)?(=| is not set)/d' "$DEFCFG"
        {
          echo "CONFIG_KSU=y"
          echo "CONFIG_KSU_MANUAL_HOOK=y"
          echo "# CONFIG_KSU_KPROBES_HOOK is not set"
        } >> "$DEFCFG"
        grep -E '^(# )?CONFIG_KSU' "$DEFCFG" || true

        # ── 5. Hooks. Each file is applied on its own so one drifted file
        # doesn't block the rest. Never blindly applies: already-present hooks
        # are skipped, only a fully clean dry-run is applied, anything else is
        # reported instead of leaving .rej/.orig files in the tree.
        # Shared bookkeeping: log + step summary + failure counter.
        record_result() {   # $1 = label ; uses global RESULT
          echo "[hooks] ${1}: ${RESULT}"
          echo "| \`${1}\` | ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          case "$RESULT" in
            applied*|already-present*|no-change|empty-diff|skipped*) ;;
            *)
              echo "::warning::[hooks] ${1}: ${RESULT}"
              HOOK_FAILS=$((HOOK_FAILS + 1))
              [ "${HOOKS_STRICT}" = "true" ] && exit 1
              ;;
          esac
          return 0
        }

        # patch(1)-based apply, used for the KernelSU manual hooks (small,
        # well-anchored hunks from a patch written for a similar tree).
        apply_hook() {   # $1 = label, $2 = patch file, $3 = "manual" (optional)
          local label="$1" p="$2" tgt syms s all
          RESULT=""
          if [ "${3:-}" = "manual" ]; then
            # If every ksu_* symbol this patch adds is already in the target
            # file (e.g. the SUSFS merge below already brought the hook in),
            # don't hook it a second time.
            tgt=$(sed -n '1s#^diff --git a/\([^ ]*\) b/.*#\1#p' "$p")
            syms=$(grep -E '^\+[^+]' "$p" | grep -oE 'ksu_[A-Za-z0-9_]+' | sort -u)
            if [ -n "$syms" ] && [ -f "$tgt" ]; then
              all=1
              for s in $syms; do grep -q "$s" "$tgt" || { all=0; break; }; done
              [ "$all" = 1 ] && RESULT="already-present"
            fi
          fi
          if [ -n "$RESULT" ]; then
            :
          elif [ ! -s "$p" ]; then
            RESULT="empty-diff"
          elif patch -p1 -R --dry-run -s -f < "$p" >/dev/null 2>&1; then
            RESULT="already-present"
          elif patch -p1 -F2 --dry-run -s < "$p" >/dev/null 2>&1; then
            patch -p1 -F2 --no-backup-if-mismatch -s < "$p" && RESULT="applied" || RESULT="apply-failed"
          else
            RESULT="conflict"
            patch -p1 -F2 --dry-run < "$p" | tail -n 25 || true
          fi
          record_result "$label"
          return 0
        }

        # 3-way merge, used for the SUSFS hooks. The SUSFS hunks come from a
        # *different* kernel tree (avicii 17-ksun), so a plain `patch` can't
        # find its context in LineageOS lineage-24.0 (that is what left
        # fs/namespace.c, fs/statfs.c, fs/proc_namespace.c ... unhooked and
        # broke the link). Instead merge file-by-file:
        #     base   = file in KSUN_BASE_SHA (same kernel without SUSFS)
        #     theirs = file in KSUN_SHA      (same kernel with SUSFS)
        #     ours   = file in this LineageOS tree
        # Only the base->theirs delta is carried over; surrounding drift in
        # this tree is irrelevant unless it touches the very same lines.
        merge_hook() {   # $1 = repo-relative file
          local f="$1" d rc
          d=$(mktemp -d)
          RESULT=""
          if [ ! -f "$f" ]; then
            RESULT="missing-in-tree"
          elif ! git -C "$SRC" show "${KSUN_BASE_SHA}:${f}" > "$d/base" 2>/dev/null \
            || ! git -C "$SRC" show "${KSUN_SHA}:${f}" > "$d/theirs" 2>/dev/null; then
            RESULT="missing-in-source"
          elif cmp -s "$d/base" "$d/theirs"; then
            RESULT="no-change"
          else
            cp "$f" "$d/ours"
            rc=0
            git merge-file -p --diff3 \
              -L "lineage:${f}" -L "base:${KSUN_BASE_SHA:0:9}" -L "ksun:${KSUN_SHA:0:9}" \
              "$d/ours" "$d/base" "$d/theirs" > "$d/merged" || rc=$?
            if [ "$rc" -eq 0 ]; then
              if cmp -s "$d/merged" "$f"; then
                RESULT="already-present"
              else
                cat "$d/merged" > "$f"
                RESULT="applied (3-way)"
              fi
            elif [ "$rc" -lt 128 ]; then
              RESULT="conflict (${rc} region(s))"
              echo "::group::conflicting regions in ${f}"
              grep -n -B3 -A14 '^<<<<<<< ' "$d/merged" | head -n 120 || true
              echo "::endgroup::"
            else
              RESULT="apply-failed"
            fi
          fi
          rm -rf "$d"
          record_result "susfs: ${f}"
          return 0
        }
        HOOK_FAILS=0
        mkdir -p ../hook-patches

        # 5a. SUSFS hooks (3-way merge of the base->ksun delta of each file).
        SUSFS_HOOK_FILES="
          fs/namei.c fs/namespace.c fs/notify/fdinfo.c fs/proc/base.c
          fs/proc/cmdline.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c
          fs/readdir.c fs/stat.c fs/statfs.c fs/super.c kernel/kallsyms.c
          kernel/sys.c mm/memory.c security/selinux/avc.c"
        for f in ${SUSFS_HOOK_FILES}; do
          merge_hook "$f"
        done

        # fs/susfs.c (copied in above) is only linkable when *all* SUSFS hooks
        # are in, so any failure here is fatal regardless of HOOKS_STRICT —
        # failing now saves the ~15 min compile that ends in undefined symbols.
        if [ "${HOOK_FAILS}" -ne 0 ]; then
          echo "::error::${HOOK_FAILS} SUSFS hook file(s) could not be merged into this tree — see the conflicting regions above"
          exit 1
        fi

        # 5b. KernelSU manual hooks.
        if [ -n "${HOOKS_PATCH_URLS// /}" ]; then
          # From the configured link(s). Each patch is split into one patch per
          # file so a drifted/duplicate file can't block the others.
          i=0
          for url in ${HOOKS_PATCH_URLS}; do
            i=$((i + 1))
            full="../hook-patches/manual_${i}.patch"
            parts="../hook-patches/manual_${i}"
            curl -fsSL "$url" -o "$full" || { echo "::error::could not download ${url}"; exit 1; }
            grep -q '^diff --git ' "$full" || { echo "::error::${url} is not a git diff/patch"; exit 1; }
            mkdir -p "$parts"
            awk -v dir="$parts" '/^diff --git /{n++; out=sprintf("%s/%02d.patch",dir,n)} n{print > out}' "$full"
            for part in "$parts"/*.patch; do
              target=$(sed -n '1s#^diff --git a/\([^ ]*\) b/.*#\1#p' "$part")
              if [ ! -e "$target" ]; then
                echo "[hooks] manual-hooks: ${target} not in this tree — skipped"
                echo "| \`manual-hooks: ${target}\` | skipped (not in tree) |" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              apply_hook "manual-hooks: ${target}" "$part" manual
            done
          done
        else
          # Fallback: the manual-hook hunks already present in the branch.
          for f in fs/exec.c fs/open.c fs/read_write.c kernel/reboot.c drivers/input/input.c; do
            out="../hook-patches/manual_$(echo "$f" | tr '/' '_').patch"
            git -C "$SRC" diff --no-color --ignore-blank-lines "${KSUN_BASE_SHA}" "${KSUN_SHA}" -- "$f" > "$out"
            apply_hook "manual-hooks: $f" "$out" manual
          done
        fi

        # ── 5c. Link-time sanity: fs/susfs.c calls helpers that live in the hooked
        # VFS files (namespace/proc_namespace/statfs). If one has no definition
        # outside susfs.c, vmlinux fails to link with "undefined symbol".
        SUSFS_MISSING=0
        for sym in susfs_get_non_sus_mnt_id_from_mnt susfs_get_non_sus_vfsmnt_from_vfsmnt \
                   statfs_by_dentry_wrapper calculate_f_flags_wrapper; do
          if grep -rEqs --include='*.c' --exclude=susfs.c \
               -e "^[A-Za-z_][^;]*[ *]${sym}[[:space:]]*\(" -e "^${sym}[[:space:]]*\(" fs; then
            echo "[susfs] ${sym}: defined"
          else
            echo "::error::[susfs] ${sym} is used by fs/susfs.c but not defined anywhere in fs/"
            SUSFS_MISSING=$((SUSFS_MISSING + 1))
          fi
        done
        [ "${SUSFS_MISSING}" -eq 0 ] || exit 1

        echo "HOOK_FAILS=${HOOK_FAILS}" >> $GITHUB_ENV
        echo "[hooks] files not hooked: ${HOOK_FAILS}"

        # ── 6. Sanity: every manual hook call site must exist in the tree AND
        # be defined by drivers/kernelsu, otherwise KernelSU builds but never gets
        # root/exec/input events (missing call site) or the link fails (missing
        # definition, i.e. the 17-ksun KSU version doesn't match the hook layout).
        for sym in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat \
                   ksu_handle_newfstat_ret ksu_handle_sys_read ksu_handle_sys_reboot \
                   ksu_handle_input_handle_event ksu_input_hook ksu_init_rc_hook; do
          if grep -rqs "$sym" fs kernel drivers/input; then
            echo "[hooks] call site ok: $sym"
            grep -rqs "$sym" drivers/kernelsu \
              || { echo "::error::[hooks] '$sym' is hooked but not defined in drivers/kernelsu (KSU/hook version mismatch)"; exit 1; }
          else
            echo "::warning::[hooks] manual hook '$sym' not found in tree"
          fi
        done

        # KernelSU-Next version is a constant in drivers/kernelsu/Kbuild.
        RSKSUVER=$(grep -oP 'KSU_VERSION=\K[0-9]+' drivers/kernelsu/Kbuild | head -n1)
        [ -n "$RSKSUVER" ] || { echo "::error::could not read KSU_VERSION"; exit 1; }
        echo "RSKSUVER=$RSKSUVER" >> $GITHUB_ENV
        echo "[KSUN] version code: $RSKSUVER"

        cd ..
        rm -rf ksun-src hook-patches

    - name: Apply Baseband-guard + NoMount
      run: |
        cd kernel_workspace/android-kernel

        # Baseband-guard
        wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

        # Fix LSM ordering safely
        if grep -q "config LSM" security/Kconfig; then
          sed -i '/^config LSM$/,/^[[:space:]]*help$/ {
            /^[[:space:]]*default/ {
              /baseband_guard/! s/selinux/selinux,baseband_guard/
            }
          }' security/Kconfig
        fi

        if [ -f "$GITHUB_WORKSPACE/patches/kernel-4.19-patch.sh" ]; then
          bash "$GITHUB_WORKSPACE/patches/kernel-4.19-patch.sh" || true
        fi

        # BBG's Makefile aborts the build unless CONFIG_BBG=y AND CONFIG_LSM
        # contains baseband_guard, so both go into the defconfig explicitly.
        DEFCFG=arch/arm64/configs/vendor/kona-perf_defconfig
        sed -i '/^CONFIG_BBG=/d;/^# CONFIG_BBG is not set/d' "$DEFCFG"
        echo "CONFIG_BBG=y" >> "$DEFCFG"
        if grep -q '^CONFIG_LSM=' "$DEFCFG"; then
          grep '^CONFIG_LSM=' "$DEFCFG" | grep -q baseband_guard \
            || sed -i '/^CONFIG_LSM=/ s/"$/,baseband_guard"/' "$DEFCFG"
        else
          echo 'CONFIG_LSM="selinux,baseband_guard"' >> "$DEFCFG"
        fi
        grep -E '^CONFIG_(BBG|LSM)=' "$DEFCFG"

        # ── NoMount Integration ────────────────────────────────────────────────
        # nomount ships a setup.sh that clones itself and wires in via a symlink
        # (fs/nomount -> NoMount/kernel/src) plus one-line additions to
        # fs/Makefile and fs/Kconfig — no patch to apply.
        curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/master/kernel/setup.sh \
          -o "$GITHUB_WORKSPACE/kernel_workspace/nomount-setup.sh"
        bash "$GITHUB_WORKSPACE/kernel_workspace/nomount-setup.sh"

        echo "[NoMount] Verifying integration..."
        ls -la fs/nomount
        grep -q "CONFIG_NOMOUNT" fs/Makefile || { echo "[NoMount] fs/Makefile not wired"; exit 1; }
        grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || { echo "[NoMount] fs/Kconfig not wired"; exit 1; }
        # ── End NoMount Integration ────────────────────────────────────────────

        # Enable NoMount subsystem (KSU + SUSFS configs were appended by the
        # integration step above).
        sed -i '/^CONFIG_NOMOUNT=/d;/^# CONFIG_NOMOUNT is not set/d' "$DEFCFG"
        echo "CONFIG_NOMOUNT=y" >> "$DEFCFG"

        # Kconfig takes the LAST occurrence of a symbol, so appending replaces
        # any earlier CONFIG_LOCALVERSION.
        echo 'CONFIG_LOCALVERSION="-zues"' >> arch/arm64/configs/vendor/kona-perf_defconfig

        # Remove dirty tag
        sed -i 's/ -dirty//g' scripts/setlocalversion

    - name: Build kernel
      run: |
        cd kernel_workspace/android-kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)

        BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu-"
        EX_CMD="LD=ld.lld LLVM=1"
        DEFCONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

        make O=out CC=clang $BA_CMD $EX_CMD $DEFCONFIG

        # Make sure the KSU/SUSFS options survived olddefconfig-style resolution.
        for opt in CONFIG_KSU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_SUSFS=y \
                   CONFIG_BBG=y CONFIG_NOMOUNT=y; do
          grep -q "^${opt}$" out/.config || {
            echo "::error::${opt} missing from resolved .config"; exit 1; }
        done
        grep -E '^CONFIG_LSM=.*baseband_guard' out/.config || {
          echo "::error::baseband_guard missing from resolved CONFIG_LSM"; exit 1; }

        make -j$(nproc --all) O=out CC=clang $BA_CMD $EX_CMD

    - name: Verify kernel output
      run: |
        cd kernel_workspace/android-kernel/out

        if [ -f arch/arm64/boot/Image ]; then
          echo "CHECK_IMAGE=true" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(cat include/config/kernel.release)" >> $GITHUB_ENV
        else
          echo "Kernel output file is empty"
          exit 1
        fi

    - name: Prepare AnyKernel3 and package
      run: |
        cd kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=zues Kernel/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cp android-kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        zip -r AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-zues_KSUN_${{ env.RSKSUVER }}.zip ./*

    - name: Upload Image artifact
      if: env.CHECK_IMAGE == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: Image-${{ matrix.ks }}
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v6
      with:
        name: AK3-${{ matrix.ks }}
        path: ${{ github.workspace }}/kernel_workspace/AnyKernel3/AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-zues_KSUN_*.zip

    - name: Save build info
      run: |
        cd kernel_workspace
        {
          echo "RSKSUVER=${{ env.RSKSUVER }}"
          echo "KERNEL_VERSION=${{ env.KERNEL_VERSION }}"
          echo "BUILD_TIME_1=${{ env.BUILD_TIME_1 }}"
          echo "KSUN_BRANCH=${{ env.KSUN_BRANCH }}"
          echo "KSUN_SHA=${{ env.KSUN_SHA }}"
          echo "HOOKS_PATCH_URLS=${{ env.HOOKS_PATCH_URLS }}"
          echo "HOOK_FILES_NOT_HOOKED=${{ env.HOOK_FAILS }}"
        } > build-info-${{ matrix.ks }}.txt

    - name: Upload build info
      uses: actions/upload-artifact@v6
      with:
        name: INFO-${{ matrix.ks }}
        path: kernel_workspace/build-info-${{ matrix.ks }}.txt

    # Record that this branch commit + base commit + hook URLs were built, so a
    # future scheduled run only rebuilds when one of them changes.
    - name: Mark source commit as built
      if: success()
      run: mkdir -p /tmp/marker && date > /tmp/ksun-built-marker
    - uses: actions/cache/save@v4
      if: success()
      with:
        path: /tmp/ksun-built-marker
        key: ksun-built-${{ needs.check-upstream.outputs.ksun_sha }}-${{ needs.check-upstream.outputs.ksun_base_sha }}-${{ needs.check-upstream.outputs.hooks_key }}
